# ===============================
# MySQL Database Configuration
# ===============================
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/reportingdb
spring.datasource.username=root
spring.datasource.password=As@#151198
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Hibernate / JPA Settings
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT Security (if used for auth)
# ===============================
app.jwt.secret=my-very-secure-secret-key-with-at-least-256-bits
app.jwt.expiration-ms=86400000

# ===============================
# Multipart File Upload
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Jackson JSON Serialization
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# ADB (Screen Learning)
# ===============================
# Full path to adb, e.g. C:/Users/<you>/AppData/Local/Android/Sdk/platform-tools/adb.exe
app.adb.path=${ADB_PATH:adb}
app.adb.timeout-ms=${ADB_TIMEOUT_MS:15000}

# ===============================
# Screen Learning - screenshot capture
# ===============================
app.screen-learning.python-path=${PYTHON_PATH:python}
# Relative paths resolve against the backend working directory
app.screen-learning.capture.script=${SCREEN_CAPTURE_SCRIPT:../ai-engine/capture/capture.py}
app.screen-learning.capture.output-dir=${SCREEN_CAPTURE_DIR:data/screen-captures}
app.screen-learning.capture.timeout-ms=${SCREEN_CAPTURE_TIMEOUT_MS:90000}
# Tesseract OCR; TESSERACT_PATH env var overrides the default below
app.screen-learning.ocr.tesseract-path=${TESSERACT_PATH:C:/Program Files/Tesseract-OCR/tesseract.exe}
app.screen-learning.ocr.lang=${SCREEN_OCR_LANG:eng}


# ===============================
# AI provider - Amazon Bedrock (OpenAI-compatible Mantle API)
# ===============================
app.ai.bedrock.base-url=${BEDROCK_BASE_URL:https://bedrock-mantle.us-east-1.api.aws/v1}
app.ai.bedrock.api-key=${BEDROCK_API_KEY:}
app.ai.bedrock.model=${BEDROCK_MODEL:deepseek.v3.2}
app.ai.bedrock.connect-timeout-ms=10000
app.ai.bedrock.request-timeout-ms=120000
app.ai.bedrock.max-attempts=2
app.ai.planner.max-attempts=3


# ===============================
# Screen Learning Phase 2 - exploration (hard limits; requests can only ask for less)
# ===============================
app.exploration.max-steps-limit=${EXPLORATION_MAX_STEPS_LIMIT:200}
app.exploration.default-max-steps=${EXPLORATION_DEFAULT_MAX_STEPS:30}
app.exploration.max-duration-limit-seconds=${EXPLORATION_MAX_DURATION_LIMIT_SECONDS:1800}
app.exploration.default-max-duration-seconds=${EXPLORATION_DEFAULT_MAX_DURATION_SECONDS:600}
app.exploration.default-settle-ms=${EXPLORATION_SETTLE_MS:1500}
app.exploration.stall-limit=${EXPLORATION_STALL_LIMIT:10}
app.exploration.max-consecutive-failures=${EXPLORATION_MAX_FAILURES:3}
# Gemma is called only for newly discovered screens, at most this many times per session
app.exploration.interpretation.enabled=${EXPLORATION_INTERPRETATION_ENABLED:true}
app.exploration.interpretation.max-per-session=${EXPLORATION_MAX_INTERPRETATIONS:20}

# ===============================
# Test library - validation and execution of user-approved scripts
# ===============================
# test-engine folder (validate_script.py, automation_ai device API, Robot library)
app.test-engine.dir=${TEST_ENGINE_DIR:../test-engine}
# One sub-directory per execution (script, log, results, screenshots)
app.test-engine.executions-dir=${TEST_EXECUTIONS_DIR:data/executions}
app.test-engine.validation-timeout-ms=${TEST_VALIDATION_TIMEOUT_MS:30000}
app.test-engine.default-timeout-seconds=${TEST_EXECUTION_DEFAULT_TIMEOUT_SECONDS:600}
app.test-engine.max-timeout-seconds=${TEST_EXECUTION_MAX_TIMEOUT_SECONDS:1800}
app.test-engine.max-log-bytes=${TEST_EXECUTION_MAX_LOG_BYTES:5242880}

